name: Daily Event Scrape

on:
  schedule:
    - cron: '0 1 * * *'    # 10:00 JST (morning refresh)
    - cron: '0 11 * * *'   # 20:00 JST (evening refresh)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scrapers/requirements.txt

      - name: Install Scrapling browser binaries
        run: scrapling install

      - name: Run scrapers
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          BANDSINTOWN_API_KEY: ${{ secrets.BANDSINTOWN_API_KEY }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
        run: python scrapers/fetch.py

      - name: Commit if data changed
        run: |
          git config user.name "yoro-bot"
          git config user.email "yoro-bot@users.noreply.github.com"
          git add data/events.json data/translations_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: update events $(date -u +%Y-%m-%d)"
            git push
          fi
